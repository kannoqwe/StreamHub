services:
  backend:
    build: ./apps/backend
    restart: always
    ports:
      - "${PORT}:3000"
    volumes:
      - ./apps/backend:/app
      - /app/node_modules
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    command: pnpm start:dev


  db:
    image: postgres:17
    restart: always
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [ "CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}" ]
      interval: 5s
      timeout: 10s
      retries: 5
    environment:
      - POSTGRES_PASSWORD
      - POSTGRES_USER
      - POSTGRES_DB
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis: 
    image: redis:8.4.0-alpine
    restart: always
    ports: 
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data

  rtmp:
    build: ./apps/rtmp-server
    restart: always
    ports:
      - "1935:1935"
      - "8080:8080"
    volumes:
      - ./hls:/var/www/html/hls
    depends_on:
      - backend

volumes:
  pgdata:
  redis_data: