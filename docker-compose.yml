services:
  backend:
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
    restart: on-failure
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/backend/node_modules
      - /app/node_modules/.pnpm
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_started
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    networks:
      - app_network

  frontend:
    build:
      context: .
      dockerfile: ./apps/frontend/Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/frontend/node_modules
    environment:
      - VITE_API_URL=http://localhost:3000
      - VITE_WS_URL=ws://localhost:8081/ws
    depends_on:
      - backend
    networks:
      - app_network

  db:
    image: postgres:17
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  srs:
    image: ossrs/srs:5
    ports:
      - "1935:1935"
      - "1985:1985"
      - "8080:8080"
    volumes:
      - ./apps/srs/srs.conf:/usr/local/srs/conf/my_srs.conf
    command: ./objs/srs -c conf/my_srs.conf
    depends_on:
      - backend
    networks:
      - app_network

  nats:
    image: nats:alpine
    command: "-js"
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data
    networks:
      - app_network

  scylla:
    image: scylladb/scylla
    command: --smp 1 --memory 750M --overprovisioned 1
    ports:
      - "9042:9042"
    networks:
      - app_network

  scylla-init:
    image: scylladb/scylla
    depends_on:
      - scylla
    volumes:
      - ./scylla-init.cql:/init.cql
    command: cqlsh scylla -f /init.cql
    networks:
      - app_network

  edge:
    build:
      context: .
      dockerfile: ./apps/edge/Dockerfile
    restart: on-failure
    ports:
      - "8081:8080"
    depends_on:
      nats:
        condition: service_started
      backend:
        condition: service_started
    env_file:
      - .env
    environment:
      - HTTP_ADDR=:8080
      - AUTH_MODE=http
      - AUTH_VERIFY_URL=http://backend:3000/auth/me
      - AUTH_TIMEOUT_MS=5000
      - EDGE_NODE_ID=1
      - BACKEND_URL=http://backend:3000
    networks:
      - app_network


volumes:
  pgdata:
  redis_data:
  nats-data:

networks:
  app_network:
    driver: bridge

