worker_processes 1;

events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;

        application live {
            live on;

            hls on;
            hls_path /var/www/html/hls;
            hls_fragment 3;
            hls_playlist_length 12;

            hls_variant _low  BANDWIDTH=800000;
            hls_variant _mid  BANDWIDTH=2400000;
            hls_variant _high BANDWIDTH=5000000;

            hls_cleanup on;
        }
    }
}

http {
    server {
        listen 8080;

        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }

            add_header Cache-Control no-cache;

            root /var/www/html;
        }
    }
}
