services:
  frontend:
    image: ${GHCR_REPOSITORY}/frontend:${IMAGE_TAG:-main}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
      edge:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app_network

  backend:
    image: ${GHCR_REPOSITORY}/backend:${IMAGE_TAG:-main}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - NATS_URL=nats://nats:4222
      - SCYLLA_CONTACT_POINTS=scylla
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      - SRS_HLS_BASE_URL=http://srs:8080
      - SRS_HLS_PATH=/hls
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      nats:
        condition: service_started
      scylla:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app_network

  migrate:
    image: ${GHCR_REPOSITORY}/backend:${IMAGE_TAG:-main}
    restart: "no"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - NATS_URL=nats://nats:4222
      - SCYLLA_CONTACT_POINTS=scylla
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      - SRS_HLS_BASE_URL=http://srs:8080
      - SRS_HLS_PATH=/hls
    command: pnpm prisma:migrate:deploy
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  edge:
    image: ${GHCR_REPOSITORY}/edge:${IMAGE_TAG:-main}
    restart: unless-stopped
    environment:
      - HTTP_ADDR=:8080
      - AUTH_MODE=http
      - AUTH_VERIFY_URL=http://backend:3000/auth/me
      - AUTH_TIMEOUT_MS=${EDGE_AUTH_TIMEOUT_MS:-5000}
      - EDGE_NODE_ID=${EDGE_NODE_ID:-1}
      - EDGE_ALLOWED_ORIGINS=${EDGE_ALLOWED_ORIGINS}
      - NATS_URL=nats://nats:4222
    depends_on:
      backend:
        condition: service_healthy
      nats:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app_network

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app_network

  nats:
    image: nats:alpine
    restart: unless-stopped
    command: "-js"
    volumes:
      - nats_data:/data
    networks:
      - app_network

  scylla:
    image: scylladb/scylla
    restart: unless-stopped
    command: --smp 1 --memory 750M --overprovisioned 1
    healthcheck:
      test: ["CMD-SHELL", "[ $$(nodetool statusgossip) = running ]"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - app_network

  scylla-init:
    image: scylladb/scylla
    restart: "no"
    depends_on:
      scylla:
        condition: service_healthy
    volumes:
      - ./scylla-init.cql:/init.cql:ro
    entrypoint: ["cqlsh", "scylla", "9042", "-f", "/init.cql"]
    networks:
      - app_network

  srs:
    image: ossrs/srs:5
    restart: unless-stopped
    ports:
      - "${RTMP_PORT:-1935}:1935"
      - "${SRS_HTTP_PORT:-8080}:8080"
    environment:
      - INGEST_HOOK_SECRET=${INGEST_HOOK_SECRET}
    volumes:
      - ./apps/srs/srs.conf.template:/tmp/srs.conf.template:ro
    command: >
      sh -c "sed 's|__INGEST_HOOK_SECRET__|'\"$${INGEST_HOOK_SECRET}\"'|g'
      /tmp/srs.conf.template > /usr/local/srs/conf/generated.conf &&
      ./objs/srs -c conf/generated.conf"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app_network

volumes:
  pgdata:
  redis_data:
  nats_data:

networks:
  app_network:
    driver: bridge
