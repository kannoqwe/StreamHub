name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "22"
  PNPM_VERSION: "10.22.0"
  GO_VERSION: "1.25"

jobs:
  node:
    name: Node apps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @streamhub/api prisma:generate

      - name: Lint backend
        run: pnpm --filter @streamhub/api lint

      - name: Test backend unit
        run: pnpm --filter @streamhub/api test:unit

      - name: Test backend integration
        run: pnpm --filter @streamhub/api test:integration

      - name: Build backend
        run: pnpm --filter @streamhub/api build

      - name: Lint frontend
        run: pnpm --filter @streamhub/web lint

      - name: Build frontend
        run: pnpm --filter @streamhub/web build

  edge:
    name: Edge service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: apps/edge/go.sum

      - name: Test edge
        working-directory: apps/edge
        run: go test ./...

      - name: Build edge
        working-directory: apps/edge
        run: go build ./cmd/edge

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs:
      - node
      - edge

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: frontend
            dockerfile: apps/frontend/Dockerfile.prod
          - name: backend
            dockerfile: apps/backend/Dockerfile.prod
          - name: edge
            dockerfile: apps/edge/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: false
          tags: streamhub-${{ matrix.service.name }}:ci
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
