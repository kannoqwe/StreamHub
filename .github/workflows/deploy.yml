name: Deploy

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy, for example main, sha-abc1234, or 1.2.0"
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload compose files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "docker-compose.prod.yml,scylla-init.cql,apps/srs/srs.conf.template"
          target: ${{ secrets.DEPLOY_PATH }}

      - name: Pull and restart services
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_ENV: ${{ secrets.DEPLOY_ENV }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: DEPLOY_ENV,GHCR_TOKEN,IMAGE_TAG
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"

            printf '%s\n' "$DEPLOY_ENV" > .env
            chmod 600 .env

            if [ -n "${GHCR_TOKEN:-}" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            fi

            GHCR_REPOSITORY="$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
            export GHCR_REPOSITORY
            export IMAGE_TAG
            export FRONTEND_PORT="$(grep -E '^FRONTEND_PORT=' .env | tail -n 1 | cut -d '=' -f 2- || true)"
            FRONTEND_PORT="${FRONTEND_PORT:-80}"

            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up migrate
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml ps
            curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 3 "http://localhost:${FRONTEND_PORT}/" >/dev/null
            curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 3 "http://localhost:${FRONTEND_PORT}/api/health" >/dev/null
            curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 3 "http://localhost:${FRONTEND_PORT}/api/ready" >/dev/null
            docker image prune -f
